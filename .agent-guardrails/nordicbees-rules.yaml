  - id: nordicbees-sql-string-interpolation
    languages: [csharp]
    severity: ERROR
    message: >
      SQL built via string interpolation ($"...") is a SQL injection risk,
      even with .Replace("'", "''") escaping. Use ExecuteSqlRawAsync or
      SqlQueryRaw with positional {0},{1} parameters, or DbParameter objects
      with @name placeholders. This exact pattern caused a real incident in
      this project on 2026-07-15. See AGENTS.md "Database writes".
    patterns:
      - pattern-regex: '=\s*\$"[^"]*\b(INSERT|UPDATE|DELETE|SELECT)\b'

  - id: nordicbees-hardcoded-test-credentials
    languages: [csharp]
    severity: WARNING
    message: >
      Hardcoded email/password-looking literals in test or source files are
      forbidden. Read credentials from appsettings.Development.json or
      environment variables. See AGENTS.md "Secrets".
    patterns:
      - pattern-either:
          - pattern: private readonly string $VAR = "$PASS";
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(password|pwd|pass).*
      - metavariable-regex:
          metavariable: $PASS
          regex: ^.{6,}$

  - id: nordicbees-migration-if-not-exists
    languages: [csharp]
    severity: ERROR
    message: >
      "ADD COLUMN IF NOT EXISTS" is not reliably supported by MariaDB in this
      project's environment (documented past failure). Use plain ADD COLUMN
      and pre-check via information_schema.COLUMNS if idempotency is needed.
    patterns:
      - pattern-regex: 'ADD COLUMN IF NOT EXISTS'

  - id: nordicbees-stringcomparison-in-linq
    languages: [csharp]
    severity: ERROR
    message: >
      StringComparison.OrdinalIgnoreCase (or any StringComparison overload
      of .Contains/.Equals/.StartsWith) inside an EF Core LINQ query against
      NordicBeesErpContext cannot be translated by the MariaDB provider and
      throws at runtime ("Translation of method 'string.Contains' failed").
      This caused a real incident in InvoiceService.SearchInvoicesAsync on
      2026-07-16. Use EF.Functions.Like(field, $"%{term}%") instead for
      case-insensitive matching. See AGENTS.md "Database writes".
    patterns:
      - pattern-either:
          - pattern: $X.Contains($Y, System.StringComparison.OrdinalIgnoreCase)
          - pattern: $X.Contains($Y, StringComparison.OrdinalIgnoreCase)
          - pattern: $X.Equals($Y, System.StringComparison.OrdinalIgnoreCase)
          - pattern: $X.Equals($Y, StringComparison.OrdinalIgnoreCase)
          - pattern: $X.StartsWith($Y, System.StringComparison.OrdinalIgnoreCase)
          - pattern: $X.StartsWith($Y, StringComparison.OrdinalIgnoreCase)
      # Only inside an EF query (semgrep has no type information, so the query is
      # recognised by shape): a lambda in a query chain that starts at a
      # DbContext-named variable's DbSet (context / ctx / db naming), a query built
      # step by step (q = q.Where(...)) from such a DbSet, or a chain that ends in an
      # EF async operator. In-memory LINQ over lists / materialised results is not
      # flagged. Known limitation: a context variable named otherwise (e.g. `erp`)
      # used with a sync terminal (.ToList()) is not recognised.
      - pattern-either:
          - patterns:
              - pattern-inside: $CTX.$SET.$OP(...)
              - metavariable-regex:
                  metavariable: $CTX
                  regex: ^(\w*[cC]ontext\w*|_?[cC]tx\w*|\w*Ctx\w*|_?[dD]b\w*)$
          # Query built step by step: q = q.Where(...) on a variable declared from a context DbSet
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $RET $M(...) {
                        ...
                        var $QV = <... $CTX.$SET ...>;
                        ...
                      }
                  - pattern-inside: |
                      $RET $M(...) {
                        ...
                        IQueryable<$QT> $QV = <... $CTX.$SET ...>;
                        ...
                      }
              - pattern-inside: $QV = $QV.$OP(...)
              - metavariable-regex:
                  metavariable: $CTX
                  regex: ^(\w*[cC]ontext\w*|_?[cC]tx\w*|\w*Ctx\w*|_?[dD]b\w*)$
          - patterns:
              - pattern-inside: $Q.$ASYNC(...)
              - metavariable-regex:
                  metavariable: $ASYNC
                  regex: ^(ToListAsync|ToArrayAsync|ToDictionaryAsync|FirstAsync|FirstOrDefaultAsync|SingleAsync|SingleOrDefaultAsync|LastAsync|LastOrDefaultAsync|AnyAsync|AllAsync|CountAsync|LongCountAsync|SumAsync|MinAsync|MaxAsync|AverageAsync|ContainsAsync|ExecuteUpdateAsync|ExecuteDeleteAsync|ForEachAsync|LoadAsync)$

  - id: nordicbees-dbnull-explicit-cast
    languages: [csharp]
    severity: WARNING
    message: >
      The `(object?)$X ?? DBNull.Value` pattern boxes a null value as
      System.DBNull before EF Core's ExecuteSqlRawAsync parameter binding
      sees it, which the MariaDB provider cannot map ("no store type
      mapping for properties of type 'DBNull'"). This caused a real
      incident in Orders CreateOrderAsync on 2026-07-16. Pass the nullable
      value directly (without the (object?) cast or ?? DBNull.Value
      fallback) to ExecuteSqlRawAsync's positional parameters instead.
    patterns:
      - pattern-regex: '\(object\?\)\s*\w+(\.\w+)*\s*\?\?\s*DBNull\.Value'

  - id: nordicbees-silent-catch-no-snackbar
    languages: [csharp]
    severity: WARNING
    message: >
      A catch block in a .razor page/dialog handler swallows the exception
      without showing it to the user (no Snackbar.Add call). Users have
      repeatedly reported forms that silently fail to save with no visible
      error, requiring manual investigation to discover. Every catch block
      in a UI action handler (button click, form submit) must call
      Snackbar.Add with the error, or explicitly log via ILogger with a
      documented reason why the user doesn't need to see it.
    patterns:
      - pattern: |
          catch ($EXTYPE $EX) { }
      - pattern-not: |
          catch ($EXTYPE $EX) { ...; Snackbar.Add(...); ... }
      - pattern-not: |
          catch ($EXTYPE $EX) { ...; _logger.Log...(...); ... }

  - id: nordicbees-schema-drift-unverified-column-mapping
    languages: [csharp]
    severity: ERROR
    message: >
      A nullable C# property (int?, string?, etc.) is being passed as an
      ExecuteSqlRawAsync positional parameter without a ?? fallback to a
      guaranteed-non-null value. This project has a recurring, real incident
      class where the C# model declares a property nullable while the actual
      DB column is NOT NULL (schema drift — the model and migration are out
      of sync). When such a null value reaches the DB it fails at runtime
      with "Column 'x' cannot be null" even though the code compiles cleanly.
      This exact mechanism has recurred FOUR times in this project:
      Delivery.cs (2026-07-17), credit_notes.applied_invoice_id create/edit
      paths (2026-08-24, twice — once per column), and a test fixture
      (2026-08-27). Before writing any nullable property into an
      INSERT/UPDATE via ExecuteSqlRawAsync, verify the real DB column's
      nullability (DESCRIBE <table>, or check Migrations/
      20260602150000_InitialCreate.cs) and add a ?? fallback to a known
      non-null value (e.g. an existing entity field) if the column is NOT
      NULL. See AGENTS.md "Database writes" and Docs/BUGLOG.md entries for
      error class `schema-drift-unverified-column-mapping`.
    patterns:
      - pattern-either:
          - pattern: $CTX.Database.ExecuteSqlRawAsync("... INSERT ...", ..., $ARG, ...)
          - pattern: $CTX.Database.ExecuteSqlRawAsync("... UPDATE ...", ..., $ARG, ...)
      - metavariable-regex:
          metavariable: $ARG
          regex: ^\w+(\.\w+)+$
      - pattern-not-regex: 'ExecuteSqlRawAsync\s*\([^;]*\?\?'

  - id: nordicbees-ef-connection-pool-race-last-insert-id
    languages: [csharp]
    severity: ERROR
    message: >
      LAST_INSERT_ID() (or SCOPE_IDENTITY()/@@IDENTITY) is being read via a
      separate SqlQueryRaw/ExecuteSqlRawAsync call after an INSERT, without
      the connection being explicitly held open across both statements.
      LAST_INSERT_ID() is CONNECTION-SCOPED in MySQL/MariaDB; EF Core's
      connection pooling serves each ExecuteSqlRawAsync/SqlQueryRaw call on
      a potentially different physical connection, so the read returns 0 (or
      a stale value) instead of the row just inserted. This has caused real
      incidents in this project TWICE: order_lines FK insert (2026-07-17) and
      ArtworkService.CreateAssetAsync (2026-08-26 — returned id 0, breaking
      the entire create→navigate flow). The fix is to wrap both statements
      in `await _context.Database.OpenConnectionAsync()` ... `finally { await
      _context.Database.CloseConnectionAsync(); }` so they run on the same
      MySQL session. See AGENTS.md "Database writes" and Docs/BUGLOG.md
      entries for error class `ef-connection-pool-race-last-insert-id`.
    patterns:
      - pattern-either:
          - pattern-regex: 'SqlQueryRaw[^;]*LAST_INSERT_ID\(\)'
          - pattern-regex: 'ExecuteSqlRawAsync\s*\(\s*"[^"]*SELECT\s+LAST_INSERT_ID\(\)[^"]*"'
          - pattern-regex: 'SqlQueryRaw[^;]*SCOPE_IDENTITY\(\)'
          - pattern-regex: 'SqlQueryRaw[^;]*@@IDENTITY'
      - pattern-not-regex: 'OpenConnectionAsync'

  - id: nordicbees-layout-lifecycle-unguarded-db-call
    languages: [csharp]
    severity: WARNING
    message: >
      An awaited Service call (a method that can throw, e.g. any *Service.
      *Async(...)) appears inside a Blazor component's lifecycle method
      (OnInitializedAsync / OnParametersSetAsync / OnAfterRenderAsync) or an
      event handler without being wrapped in try/catch. An unhandled
      exception in a layout's lifecycle method, or in any component's event
      handler, TERMINATES the entire Blazor Server circuit — every open page
      for that user goes blank and unresponsive until they manually reload.
      This has caused real incidents in this project: MainLayout.razor's
      OnInitializedAsync calling CompanySettingsService.GetSettingsAsync()
      unguarded (2026-08-18), and InvoiceView.razor's HandleConfirm plus 7
      sibling handlers calling InvoiceService methods unguarded (2026-08-23).
      Wrap every Service call in a .razor file that can throw in try/catch,
      and surface the error via Snackbar.Add(ex.Message, Severity.Error) so
      the user sees what went wrong instead of a silently dead circuit. See
      AGENTS.md and Docs/BUGLOG.md entries for error class
      `layout-lifecycle-unguarded-db-call`.
    patterns:
      - pattern-either:
          - pattern: |
              protected override async Task OnInitializedAsync()
              {
                ...;
                await $SERVICE.$METHOD(...);
                ...
              }
          - pattern: |
              protected override async Task OnParametersSetAsync()
              {
                ...;
                await $SERVICE.$METHOD(...);
                ...
              }
          - pattern: |
              protected override async void OnAfterRenderAsync(bool firstRender)
              {
                ...;
                await $SERVICE.$METHOD(...);
                ...
              }
      - pattern-not: |
          protected override async Task OnInitializedAsync()
          {
            ...;
            try {
              ...;
              await $SERVICE.$METHOD(...);
              ...
            }
            catch ($EXTYPE $EX) { ... }
            ...
          }
      - pattern-not: |
          protected override async Task OnParametersSetAsync()
          {
            ...;
            try {
              ...;
              await $SERVICE.$METHOD(...);
              ...
            }
            catch ($EXTYPE $EX) { ... }
            ...
          }
      - pattern-not: |
          protected override async void OnAfterRenderAsync(bool firstRender)
          {
            ...;
            try {
              ...;
              await $SERVICE.$METHOD(...);
              ...
            }
            catch ($EXTYPE $EX) { ... }
            ...
          }

  - id: nordicbees-mariadb-datetime-precision-default-mismatch
    languages: [csharp]
    severity: ERROR
    message: >
      A SQL DATETIME(n) or TIMESTAMP(n) column definition (n > 0, i.e. with
      explicit fractional-seconds precision) is being given a bare
      `DEFAULT CURRENT_TIMESTAMP` without the matching `(n)` precision
      argument. MariaDB/MySQL REJECTS this at CREATE TABLE time with
      ERROR 1067 "Invalid default value" — when a datetime column declares a
      fractional precision, the CURRENT_TIMESTAMP default function must be
      called with the SAME precision (e.g. `DATETIME(6) ... DEFAULT
      CURRENT_TIMESTAMP(6)`), or the statement fails before any table is
      created. This caused a real incident in this project on 2026-08-26
      (Artwork multi-file/label-types migration scripts, both agent-authored
      with the identical latent defect). Write `DEFAULT CURRENT_TIMESTAMP(n)`
      to match the column's `(n)`, or use bare `DATETIME` / bare
      `CURRENT_TIMESTAMP` (both precision 0) — never mix a precise column
      with an imprecise default. See AGENTS.md "Migrations" and Docs/BUGLOG.md
      entry for error class `mariadb-datetime-precision-default-mismatch`.
    patterns:
      - pattern-regex: '(DATETIME|TIMESTAMP)\s*\(\s*[1-9]\d*\s*\)[^,;]*DEFAULT\s+CURRENT_TIMESTAMP\s*([^((]|$)'

  - id: nordicbees-ef-decimal-precision-annotation-missing
    languages: [csharp]
    severity: ERROR
    message: >
      A `decimal` (or `decimal?`) property on an EF Core entity class
      ([Table]-attributed, in the Models namespace) has no explicit precision
      annotation — neither [Precision(p, s)] nor
      [Column(TypeName="decimal(p,s)")]. Without one, the Pomelo MySQL provider
      infers decimal(65,30) (its provider default) for the property, which
      diverges from the real DB column type (e.g. decimal(5,2)). A future
      `dotnet ef migrations add` would then emit an unintended, unreviewed
      `ALTER COLUMN ... decimal(65,30)` against the live table — and any value
      exceeding the actual column's scale silently truncates. This caused a real
      incident in this project on 2026-08-27: four model classes declared
      `decimal DefaultVatRate` with no precision annotation while the live DB
      columns business_partners.default_vat_rate and company_settings.
      default_vat_rate are decimal(5,2) (fixed in commit a6e7d9c by adding
      [Precision(5, 2)]). Add [Precision(p, s)] (matching the ACTUAL DB column —
      verify with DESCRIBE <table> or Migrations/20260602150000_InitialCreate.cs,
      never guess) directly above the property, or use
      [Column(TypeName="decimal(p,s)")]. See AGENTS.md "Database writes" and
      Docs/BUGLOG.md entry for error class `ef-decimal-precision-annotation-missing`.
    patterns:
      # Scope to EF entity classes: a [Table]-attributed class. (Deliberately
      # [Table]-only, not "any Models class": the BUGLOG notes that [Table]-less
      # aliases such as Supplier/Customer are NOT real tables, and view-models
      # like WeeklyForecastItem have bare decimal properties — flagging those
      # would be noise.)
      # 2026-09-26 (Etapas 0c C8): the previous pattern did not parse (so this
      # rule never ran); rewritten as a class-scoped property match.
      # Semgrep's C# engine does not match auto-property declarations structurally,
      # so the class scope is structural and the property line is a regex.
      - pattern-inside: |
          [Table(...)]
          class $CLASS { ... }
      - pattern-regex: '(?m)^[ \t]*public[ \t]+decimal\??[ \t]+\w+[ \t]*\{[ \t]*get;[ \t]*set;[ \t]*\}'
      # Exclude properties that already carry an explicit precision annotation
      # (either accepted form, possibly stacked with other attributes / comments),
      # e.g. CompanySettings.DefaultVatRate [Precision(5, 2)].
      - pattern-not-regex: '\[Precision\s*\([^\]]*\)\]\s*(?:(?:\[[^\n]*\]|//[^\n]*)\s*)*public\s+decimal\??\s+\w+\s*\{\s*get;\s*set;\s*\}'
      - pattern-not-regex: '\[Column\s*\([^\]]*TypeName\s*=\s*"decimal\s*\(\s*\d+\s*,\s*\d+\s*\)"[^\]]*\)\]\s*(?:(?:\[[^\n]*\]|//[^\n]*)\s*)*public\s+decimal\??\s+\w+\s*\{\s*get;\s*set;\s*\}'

  - id: nordicbees-pdf-locale-string-hardcoded-outside-labels
    languages: [csharp]
    severity: WARNING
    message: >
      A hardcoded string literal is being passed directly to a QuestPDF
      .Text("...") call in a PDF-generating service. All visible UI text in
      generated PDFs (titles, labels, headers) must route through the
      LocalizationLabels record instead of inline literals — this keeps the
      text localizable and consistent across documents. This caused a real
      incident on 2026-08-24: the CreditNote PDF hardcoded its title as
      .Text("KREDITINĖ SĄSKAITA FAKTŪRA") instead of labels.CreditNoteTitle,
      and its label as "Credit invoice: {originalInvoiceNumber}" instead of
      labels.CreditedInvoiceLabel. WARNING severity (not ERROR) because some
      legitimate infrastructure strings exist — currency codes (EUR), ISO
      date formats, numbers like "N2", and pure formatting strings are fine
      inline; only visible UI text (Lithuanian/English words) must go through
      LocalizationLabels. See AGENTS.md "Security scanning" and Docs/BUGLOG.md
      entry for error class `pdf-locale-string-hardcoded-outside-labels`.
    patterns:
      # Direct literal: .Text("visible text") — the exact 2026-08-24 incident shape.
      # Requires at least one alphabetic run of 3+ chars (Lithuanian/English words)
      # so pure numbers, "N2", currency codes, and date-format tokens don't match.
      - pattern-regex: '\.Text\(\s*"[^"]*[a-zA-ZÀ-ž]{3,}[^"]*"\s*\)'
      # Exclude strings that are clearly formatting/infrastructure, not UI text:
      # currency codes (EUR), ISO date format patterns (yyyy-MM-dd etc.), or
      # short tokens like "N2" that happen to contain a 3-letter run.
      - pattern-not-regex: '\.Text\(\s*"(?:EUR|USD|[A-Z]{3}|[0-9][^"]{0,10}|yyyy[^"]*|MM[^"]*|dd[^"]*)"\s*\)'

  - id: nordicbees-enum-array-contains-in-linq-where
    languages: [csharp]
    severity: WARNING
    message: >
      Array/list built from enum literals (e.g. new[] { Status.A, Status.B })
      then checked with .Contains() inside an EF Core LINQ Where()/Any()/All()
      predicate triggers a known .NET runtime interpreter bug (ReadOnlySpan<TEnum>
      parameter extraction). See Docs/FROZEN.md #10 / BUGLOG.md
      enum-array-contains-readonlyspan-interpreter-bug (2026-08-29). Replace with
      explicit != comparisons chained together.
    patterns:
      - pattern-either:
          - pattern: |
              var $ARR = new[] { $ENUM.$V1, $ENUM.$V2, ... };
              ...
              $Q.Where($X => $ARR.Contains($X.$PROP));
          - pattern: |
              var $ARR = new $T[] { $ENUM.$V1, $ENUM.$V2, ... };
              ...
              $Q.Where($X => $ARR.Contains($X.$PROP));

  - id: nordicbees-direct-file-bytes-io-outside-storage
    languages: [csharp]
    severity: ERROR
    message: >
      Direct file I/O via File.WriteAllBytes/WriteAllBytesAsync/ReadAllBytes/
      ReadAllBytesAsync outside Services/Storage/ is forbidden. All file
      persistence must go through IFileStore (Services/Storage/FileStore.cs),
      which owns the files table, SHA-256 dedup, and the blob layout. This
      guardrail exists because 247 expense-invoice OCR uploads were written
      straight into the container (no volume mount) and lost on every deploy
      (2026-09-15, storage step 1). Existing exceptions (paths.exclude below;
      each carries a documented expiry in the storage step-1 report):
      /Services/Artwork/** (artwork pipeline, pre-dates IFileStore),
      /Services/DeliveryReceiptPdfService.cs (delivery receipts — planned for
      a later storage step), /Helpers/PdfFileCache.cs (sales-invoice +
      credit-note PDF cache — its base dirs /var/lib/nordicbees/invoices and
      /var/lib/nordicbees/credit-notes have NO volume mount in deploy.yml, so
      cached PDFs are written inside the container and lost on every deploy;
      expiry: migrate invoice/credit-note PDF storage to IFileStore in a
      separate package). Do not add new paths to this allow-list without a
      named expiry.
    patterns:
      - pattern-either:
          - pattern: File.WriteAllBytes(...)
          - pattern: File.WriteAllBytesAsync(...)
          - pattern: File.ReadAllBytes(...)
          - pattern: File.ReadAllBytesAsync(...)
    paths:
      exclude:
        - "/Services/Storage/**"
        - "/Tests/**"
        - "/Services/Artwork/**"
        - "/Services/DeliveryReceiptPdfService.cs"
        - "/Helpers/PdfFileCache.cs"

  - id: nordicbees-storage-path-combine-outside-storage
    languages: [csharp]
    severity: ERROR
    message: >
      Path.Combine whose first argument is a string literal mentioning
      wwwroot, uploads, or /var/lib/nordicbees — or a local variable
      initialized to such a literal — outside Services/Storage/ is
      forbidden: it is the signature of direct file-system access bypassing
      IFileStore (Services/Storage/FileStore.cs), which is where all blob
      paths are built. This guardrail exists because 247 expense-invoice OCR
      uploads were written straight into the container (no volume mount) and
      lost on every deploy (2026-09-15, storage step 1). Existing exceptions
      (paths.exclude below; each carries a documented expiry in the storage
      step-1 report): /Services/Artwork/** (artwork pipeline, pre-dates
      IFileStore), /Services/DeliveryReceiptPdfService.cs (delivery receipts
      — planned for a later storage step), /Helpers/PdfFileCache.cs
      (sales-invoice + credit-note PDF cache — its base dirs
      /var/lib/nordicbees/invoices and /var/lib/nordicbees/credit-notes have
      NO volume mount in deploy.yml, so cached PDFs are written inside the
      container and lost on every deploy; expiry: migrate
      invoice/credit-note PDF storage to IFileStore in a separate package).
      Do not add new paths to this allow-list without a named expiry.
    patterns:
      - pattern-either:
          - pattern: Path.Combine($VAL, ...)
          - pattern: |
              var $DIR = $VAL;
              ...
              Path.Combine($DIR, ...)
          - pattern: |
              string $DIR = $VAL;
              ...
              Path.Combine($DIR, ...)
      # Owner-approved 2026-09-16 (option a): the three artwork endpoints in
      # Program.cs (:185-187, :212-213, :232-233) build paths from the artwork
      # storage config fallback. Excluded by exact shape (config key + fallback
      # literal), NOT by file — the rest of Program.cs stays under both rules.
      # If the config key or fallback literal ever changes, these sites will
      # start failing the guardrail until this exclusion is updated — loud, by design.
      - pattern-not: |
          var $DIR = config["ArtworkStorage:StorageRoot"] ?? "/var/lib/nordicbees/artwork";
          ...
          Path.Combine($DIR, ...)
      # metavariable-regex is FULL-MATCH in semgrep (the regex must span the
      # entire metavariable text, e.g. the quoted literal
      # "/var/lib/nordicbees/x") — hence the .* anchors.
      - metavariable-regex:
          metavariable: $VAL
          regex: .*(wwwroot|uploads|/var/lib/nordicbees).*
    paths:
      exclude:
        - "/Services/Storage/**"
        - "/Tests/**"
        - "/Services/Artwork/**"
        - "/Services/DeliveryReceiptPdfService.cs"
        - "/Helpers/PdfFileCache.cs"
