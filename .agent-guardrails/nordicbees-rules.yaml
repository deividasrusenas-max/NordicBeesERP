rules:
  - id: nordicbees-notracking-savechanges
    languages: [csharp]
    severity: ERROR
    message: >
      This project uses global QueryTrackingBehavior.NoTracking. Calling
      SaveChangesAsync() after Add/Update/Remove on a tracked entity silently
      persists 0 rows with no error. Use ExecuteSqlRawAsync with positional
      {0},{1} parameters instead. See AGENTS.md "Database writes".
    # Fires only on the real anti-pattern: SaveChangesAsync in a method that also (anywhere,
    # incl. nested blocks) changes entity state explicitly (Update / Remove / Attach / Entry) or
    # reads through EF (Find / First / Single / Last / ToList / ToArray ...Async) and then mutates
    # the read entity (=, +=, -=, ++, --, nested member, or per item in a foreach over a list).
    # Insert-only Add / AddAsync / AddRange + SaveChangesAsync is correct under NoTracking and is
    # not flagged. Rule tests: .agent-guardrails/.semgrep/nordicbees-rules.cs (semgrep --test).
    patterns:
      - pattern: $CTX.SaveChangesAsync(...)
      - pattern-either:
          - pattern-either:
              - pattern-inside: |
                  $RET $M(...) {
                    ...
                    $CTX.$SET.Update(...);
                    ...
                  }
              - pattern-inside: |
                  $RET $M(...) {
                    ...
                    $CTX.Update(...);
                    ...
                  }
              - pattern-inside: |
                  $RET $M(...) {
                    ...
                    $CTX.$SET.UpdateRange(...);
                    ...
                  }
              - pattern-inside: |
                  $RET $M(...) {
                    ...
                    $CTX.UpdateRange(...);
                    ...
                  }
              - pattern-inside: |
                  $RET $M(...) {
                    ...
                    $CTX.$SET.Remove(...);
                    ...
                  }
              - pattern-inside: |
                  $RET $M(...) {
                    ...
                    $CTX.Remove(...);
                    ...
                  }
              - pattern-inside: |
                  $RET $M(...) {
                    ...
                    $CTX.$SET.RemoveRange(...);
                    ...
                  }
              - pattern-inside: |
                  $RET $M(...) {
                    ...
                    $CTX.RemoveRange(...);
                    ...
                  }
              - pattern-inside: |
                  $RET $M(...) {
                    ...
                    $CTX.$SET.Attach(...);
                    ...
                  }
              - pattern-inside: |
                  $RET $M(...) {
                    ...
                    $CTX.Attach(...);
                    ...
                  }
              - pattern-inside: |
                  $RET $M(...) {
                    ...
                    $CTX.Entry($X).State = $V;
                    ...
                  }
              - pattern-inside: |
                  $RET $M(...) {
                    ...
                    $CTX.Entry($X).$MM(...).$P = $V;
                    ...
                  }
