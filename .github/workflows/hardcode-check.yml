name: Hardcode Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  hardcode-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for hardcoded VAT multipliers
        run: |
          if grep -rn "1\.21m\|0\.21m" --include="*.cs" --include="*.razor" \
            --exclude-path="*/bin/*" --exclude-path="*/obj/*" \
            --exclude-path="*/.kilo/*" --exclude-path="*/Migrations/*" .; then
            echo "❌ Hardcoded VAT multiplier found. Use SubtotalExclVat/TotalVat from invoice data."
            exit 1
          fi

      - name: Check for hardcoded company name
        run: |
          if grep -rn "MB Lakštena\|MB Lakstena" --include="*.cs" --include="*.razor" \
            --exclude-path="*/bin/*" --exclude-path="*/obj/*" \
            --exclude-path="*/.kilo/*" --exclude-path="*/Migrations/*" .; then
            echo "❌ Hardcoded company name found. Use ICompanySettingsService."
            exit 1
          fi

      - name: Check for Console.WriteLine in production code
        run: |
          if grep -rn "Console\.WriteLine" --include="*.cs" \
            --exclude-path="*/bin/*" --exclude-path="*/obj/*" \
            --exclude-path="*/.kilo/*" --exclude-path="*/Migrations/*" .; then
            echo "❌ Console.WriteLine found. Use ILogger instead."
            exit 1
          fi

      - name: Check for Directory.GetCurrentDirectory
        run: |
          if grep -rn "Directory\.GetCurrentDirectory" --include="*.cs" \
            --exclude-path="*/bin/*" --exclude-path="*/obj/*" \
            --exclude-path="*/.kilo/*" --exclude-path="*/Migrations/*" .; then
            echo "❌ Directory.GetCurrentDirectory found. Use IWebHostEnvironment.WebRootPath."
            exit 1
          fi

      - name: Check for FindAsync+SaveChangesAsync anti-pattern (FROZEN.md)
        run: |
          BAD_FILES=""
          for f in $(grep -rl "FindAsync(" --include="*.cs" \
            --exclude-dir=bin --exclude-dir=obj \
            --exclude-dir=.kilo --exclude-dir=Migrations .); do
            if grep -q "SaveChangesAsync()" "$f"; then
              BAD_FILES="${BAD_FILES}${f}"
            fi
          done
          if [ -n "$BAD_FILES" ]; then
            echo "❌ FROZEN.md anti-pattern found (FindAsync + SaveChangesAsync in same file):"
            echo -e "$BAD_FILES"
            echo "Fix with ExecuteSqlRawAsync per FROZEN.md."
            exit 1
          fi

      - name: Run Semgrep scan
        run: |
          pip install semgrep
          # Points directly at the real rules file, not .semgrep.yml — confirmed
          # (2026-09-06) that .semgrep.yml's `rules: [path]` include syntax
          # crashes semgrep outright; see .semgrep.yml's own comment.
          # Baseline: fail only on findings NEW since baselineCommit. Full git history
          # is required (hence fetch-depth: 0 on the checkout above). If the baseline
          # JSON or its baselineCommit field is missing, fall back to a plain
          # (un-baselined) scan, which fails on pre-existing findings - loud by design.
          BASELINE_FILE=".agent-guardrails/baselines/nordicbees-notracking-savechanges.baseline.json"
          BASELINE_COMMIT=""
          if [ -f "$BASELINE_FILE" ]; then
            BASELINE_COMMIT="$(jq -r '.baselineCommit // empty' "$BASELINE_FILE")"
          fi
          if [ -n "$BASELINE_COMMIT" ]; then
            semgrep scan --config=.agent-guardrails/nordicbees-rules.yaml --baseline-commit "$BASELINE_COMMIT" --error
          else
            echo "WARNING: semgrep baseline not found - running un-baselined scan (will fail on pre-existing findings)."
            semgrep scan --config=.agent-guardrails/nordicbees-rules.yaml --error
          fi

