<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>NordicBeesERP — harness stats</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --line:#252a34; --ink:#e6e9ef; --dim:#8b94a7;
  --ok:#4ea87a; --warn:#d9a441; --bad:#c85a54; --acc:#5b8dd6; --acc2:#9a7bd0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px}
h1{font-size:18px;margin:0 0 2px}
h2{font-size:13px;margin:0 0 12px;color:var(--dim);font-weight:600;
  text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--dim);font-size:12px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi .v{font-size:24px;font-weight:600;line-height:1.1}
.kpi .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.panel.wide{grid-column:1/-1}
.note{font-size:11px;color:var(--dim);margin-top:10px;line-height:1.5}
.toolittle{font-size:12px;color:var(--dim);padding:18px 4px;text-align:center;border:1px dashed var(--line);border-radius:6px}
svg{display:block;width:100%;overflow:visible}
.axis{stroke:var(--line);stroke-width:1}
.gl{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4;opacity:.6}
text{fill:var(--dim);font-size:10px}
text.val{fill:var(--ink);font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:11px;color:var(--dim)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.err{background:#2a1618;border:1px solid var(--bad);border-radius:8px;padding:14px;color:#f0c0bd;font-size:12px}
.warnbox{background:#2a2210;border:1px solid var(--warn);border-radius:8px;padding:10px 14px;color:#f0dcae;font-size:11.5px;margin-bottom:12px}
.bar:hover{opacity:.75;cursor:default}
.controls{margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--dim)}
button{background:var(--panel);border:1px solid var(--line);color:var(--ink);
  padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
button.on{border-color:var(--acc);color:var(--acc)}
button:hover{border-color:var(--acc)}
input[type=date],select{background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:6px;padding:4px 8px;font-size:12px;font-family:inherit}
.customrange{display:flex;gap:6px;align-items:center;padding-left:8px;border-left:1px solid var(--line)}
.customrange.on{color:var(--acc)}
.evtline{stroke:var(--acc2);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.evtlabel{fill:var(--acc2);font-size:9px}
.evtmark:hover .evtline{opacity:1;stroke-width:1.5}
.scrollx{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:none}
details.task-item{border:1px solid var(--line);border-radius:6px;margin-bottom:6px;background:#12151b}
details.task-item summary{padding:9px 12px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;
  gap:12px;align-items:baseline;font-size:12.5px}
details.task-item summary::-webkit-details-marker{display:none}
details.task-item summary::before{content:'▸';color:var(--dim);margin-right:8px;display:inline-block;width:8px}
details.task-item[open] summary::before{content:'▾'}
details.task-item summary .tid{color:var(--ink);font-weight:600}
details.task-item summary .tmeta{color:var(--dim);flex:1;text-align:right}
details.task-item .deleg-wrap{padding:0 12px 10px}
.badge-unreliable{color:var(--bad);border-bottom:1px dashed var(--bad);cursor:help;white-space:nowrap}
.badge-incomplete{color:var(--dim);font-style:italic}
.badge-rejected{color:var(--bad)}
.badge-approved{color:var(--ok)}
.evtlist{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.evtrow{display:flex;gap:10px;font-size:11.5px;padding:4px 0;border-bottom:1px solid var(--line);cursor:help}
.evtrow .d{color:var(--dim);white-space:nowrap;width:150px;flex:none}
.evtrow .c{color:var(--acc2);white-space:nowrap;width:72px;flex:none;font-family:ui-monospace,monospace}
.evtrow .t{color:var(--ink)}
.balayout{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.balayout .side h3{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
.ba-n{color:var(--dim);font-size:10.5px}
.ba-notmeaningful{color:var(--warn)}
@media (max-width:760px){.balayout{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Harness stats</h1>
<div class="sub" id="range">kraunama…</div>
<div class="controls" id="rangeBar">
  <button data-preset="today">Šiandien</button>
  <button data-preset="yesterday">Vakar</button>
  <button data-preset="7d">7 dienos</button>
  <button data-preset="30d">30 dienų</button>
  <button data-preset="all">Viskas</button>
  <span class="customrange" id="customWrap">
    <input type="date" id="fromDate"> – <input type="date" id="toDate">
    <button id="applyCustom">taikyti</button>
  </span>
</div>
<div id="app"></div>

<script>
const F = {
  tasks:'task-stats.jsonl',
  cb:'circuit-breaker.jsonl',
  timing:'orchestrator-timing.jsonl',
  events:'harness-events.json'
};
const C = {ok:'#4ea87a',warn:'#d9a441',bad:'#c85a54',acc:'#5b8dd6',acc2:'#9a7bd0',dim:'#8b94a7'};
const AGENT_C = {coder:'#5b8dd6',fixer:'#4ea87a',reviewer:'#9a7bd0',verifier:'#d9a441',
                 'visual-qa':'#c98a5a','design-review':'#7fb0a3'};
const ONE_DAY = 86400000;
let DATA = null;          // {delegations, cb, timing, events}
let RANGE_SPEC = {preset:'today'};

async function jsonl(f){
  const r = await fetch(f);
  if(!r.ok) throw new Error(f+' → HTTP '+r.status);
  return r.text().then(t => t.split('\n').filter(Boolean).map(l => {
    try { return JSON.parse(l); } catch(e){ return null; }
  }).filter(Boolean));
}
async function jsonFile(f){
  const r = await fetch(f);
  if(!r.ok) throw new Error(f+' → HTTP '+r.status);
  return r.json();
}
const day = ts => (ts||'').slice(0,10);
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ---------- delegation model ----------
// task-stats.jsonl writes 1-3 raw rows per delegation (started / interrupted / completed,
// keyed by call_id). This collapses them into one delegation record per call_id so every
// panel counts each real delegation exactly once, and resolves the two documented data
// caveats: (1) a call_id that has BOTH an interrupted row and a later completed row is a
// real completion, not two separate outcomes; (2) an interrupted row with no completed row
// is an incomplete/aborted delegation whose duration may itself be a stale-sweep artifact
// (Docs/BUGLOG.md, error class aborted-subagent-leaves-outer-task-call-unresolved) rather
// than real elapsed time -- detected by clustering: the quality-monitor's stale sweep flags
// several pending calls within milliseconds of each other, so any interrupted-with-no-
// completed call sharing that near-identical timestamp with 1+ others is marked unreliable.
function buildDelegations(tasks){
  const byCall = new Map();
  const legacy = [];
  for(const t of tasks){
    if(t.call_id==null){ legacy.push(t); continue; }
    let g = byCall.get(t.call_id);
    if(!g){ g = {call_id:t.call_id, rows:[]}; byCall.set(t.call_id, g); }
    g.rows.push(t);
  }
  const out = [];
  for(const g of byCall.values()){
    const started = g.rows.find(r=>r.status==='started');
    const completed = g.rows.find(r=>r.status==='completed');
    const interrupted = g.rows.find(r=>r.status==='interrupted');
    const any = completed||interrupted||started;
    const base = {
      task_id: any.task_id, call_id: g.call_id, agent: any.agent, model: any.model,
      prompt_chars: started ? (started.prompt_chars||null) : null,
      ts_start: started ? started.ts : null,
      unreliable:false, unreliableReason:null, legacy:false
    };
    if(completed){
      out.push(Object.assign(base, {
        status:'completed', ts_end:completed.ts,
        duration_sec: completed.duration_sec>0?completed.duration_sec:null,
        n_toolcalls: completed.n_toolcalls!=null?completed.n_toolcalls:null,
        verdict: completed.verdict||null, guardrail_score: completed.guardrail_score!=null?completed.guardrail_score:null
      }));
    } else if(interrupted){
      out.push(Object.assign(base, {
        status:'interrupted', ts_end:interrupted.ts,
        duration_sec: interrupted.duration_sec>0?interrupted.duration_sec:null,
        n_toolcalls: interrupted.n_toolcalls!=null?interrupted.n_toolcalls:null,
        verdict:null, guardrail_score:null
      }));
    } else if(started){
      out.push(Object.assign(base, {
        status:'incomplete', ts_end:null, duration_sec:null, n_toolcalls:null, verdict:null, guardrail_score:null
      }));
    }
  }
  for(const t of legacy){
    out.push({
      task_id:t.task_id, call_id:null, agent:t.agent, model:t.model,
      prompt_chars:t.prompt_chars||null, ts_start:t.ts, ts_end:t.ts,
      status:'completed', duration_sec:null, n_toolcalls:null,
      verdict:t.verdict||null, guardrail_score:null,
      unreliable:false, unreliableReason:null, legacy:true
    });
  }
  markStaleSweepArtifacts(out);
  return out;
}
function markStaleSweepArtifacts(delegations){
  const REASON = 'Stale-sweep artefaktas: trukmė yra laikas iki quality-monitor 10 min. '+
    'stale-sweep aptikimo, o ne reali vykdymo trukmė (sesija realiai buvo nutraukta cirkuito '+
    'pertraukiklio per kelias minutes). Žr. Docs/BUGLOG.md, error class '+
    '„aborted-subagent-leaves-outer-task-call-unresolved" (2026-09-10).';
  const its = delegations.filter(d=>d.status==='interrupted' && d.ts_end)
    .sort((a,b)=>new Date(a.ts_end)-new Date(b.ts_end));
  let i=0;
  while(i<its.length){
    let j=i;
    while(j+1<its.length && (new Date(its[j+1].ts_end)-new Date(its[j].ts_end))<=2000) j++;
    if(j>i){
      for(let k=i;k<=j;k++){ its[k].unreliable=true; its[k].unreliableReason=REASON; }
    }
    i=j+1;
  }
}
// best-effort enrichment: attach a human description to each delegation by matching its
// started ts+agent against orchestrator-timing.jsonl's "task" started rows (different ID
// space entirely -- task-stats' task_id/call_id never appear in orchestrator-timing, whose
// own session_id/call_id are independently generated). The two files are written by
// different plugin hooks around the same real Task-tool invocation, so their timestamps
// land within milliseconds of each other; matched greedily on (agent, nearest ts, <=3s,
// each orchestrator-timing row consumed at most once). Coverage is partial: orchestrator-
// timing.jsonl only starts 2026-09-09T17:06 (added that day), vs task-stats back to 08-22.
function enrichDescriptions(delegations, timing){
  const started = timing.filter(r=>r.tool==='task' && r.duration_ms==null);
  const byAgent = new Map();
  for(const o of started){
    const agent = (o.args_summary||'').split(':')[0].trim();
    if(!byAgent.has(agent)) byAgent.set(agent, []);
    byAgent.get(agent).push(o);
  }
  const sorted = delegations.filter(d=>d.ts_start).slice().sort((a,b)=>new Date(a.ts_start)-new Date(b.ts_start));
  for(const d of sorted){
    const cands = byAgent.get(d.agent);
    if(!cands || !cands.length) continue;
    const t0 = +new Date(d.ts_start);
    let bestIdx=-1, bestDiff=Infinity;
    cands.forEach((o,i)=>{ const diff=Math.abs(+new Date(o.ts)-t0); if(diff<bestDiff){bestDiff=diff;bestIdx=i;} });
    if(bestIdx>=0 && bestDiff<=3000){
      d.desc = (o=>o.args_summary.split(':').slice(1).join(':').trim())(cands[bestIdx]);
      cands.splice(bestIdx,1);
    }
  }
}

// ---------- range handling ----------
function startOfLocalDay(ms){ const x=new Date(ms); x.setHours(0,0,0,0); return x.getTime(); }
function computeRangeBounds(spec){
  const now = Date.now();
  const t0 = startOfLocalDay(now);
  switch(spec.preset){
    case 'today': return {start:t0, end:t0+ONE_DAY, label:'Šiandien'};
    case 'yesterday': return {start:t0-ONE_DAY, end:t0, label:'Vakar'};
    case '7d': return {start:t0-6*ONE_DAY, end:t0+ONE_DAY, label:'Paskutinės 7 dienos'};
    case '30d': return {start:t0-29*ONE_DAY, end:t0+ONE_DAY, label:'Paskutinės 30 dienų'};
    case 'all': return {start:-Infinity, end:Infinity, label:'Visi duomenys'};
    case 'custom': {
      const s = spec.from ? startOfLocalDay(+new Date(spec.from+'T00:00:00')) : -Infinity;
      const e = spec.to ? startOfLocalDay(+new Date(spec.to+'T00:00:00'))+ONE_DAY : Infinity;
      return {start:s, end:e, label:'Nuo '+(spec.from||'…')+' iki '+(spec.to||'…')};
    }
    default: return {start:t0, end:t0+ONE_DAY, label:'Šiandien'};
  }
}
function inRange(tsIso, bounds){
  if(!tsIso) return false;
  const t = +new Date(tsIso);
  return t>=bounds.start && t<bounds.end;
}
function delegTs(d){ return d.ts_end || d.ts_start; }
function parseHash(){
  const h = location.hash.replace(/^#/,'');
  const m = h.match(/(?:^|&)range=([^&]+)/);
  if(!m) return {preset:'today'};
  const v = decodeURIComponent(m[1]);
  if(v.indexOf('custom:')===0){
    const parts = v.split(':');
    return {preset:'custom', from:parts[1]||'', to:parts[2]||''};
  }
  if(['today','yesterday','7d','30d','all'].indexOf(v)>=0) return {preset:v};
  return {preset:'today'};
}
function writeHash(spec){
  let v = spec.preset;
  if(spec.preset==='custom') v = 'custom:'+(spec.from||'')+':'+(spec.to||'');
  history.replaceState(null,'','#range='+v);
}
function syncRangeUI(){
  document.querySelectorAll('#rangeBar button[data-preset]').forEach(b=>
    b.classList.toggle('on', b.dataset.preset===RANGE_SPEC.preset));
  document.getElementById('customWrap').classList.toggle('on', RANGE_SPEC.preset==='custom');
  if(RANGE_SPEC.preset==='custom'){
    document.getElementById('fromDate').value = RANGE_SPEC.from||'';
    document.getElementById('toDate').value = RANGE_SPEC.to||'';
  }
}

// ---------- generic SVG / format helpers ----------
function svgOpen(w,h){ return `<svg viewBox="0 0 ${w} ${h}">`; }
function yAxis(x0,y0,y1,max,w,ticks=4){
  let s=`<line class="axis" x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}"/>`;
  for(let i=0;i<=ticks;i++){
    const v=max*i/ticks, y=y1-(y1-y0)*i/ticks;
    s+=`<line class="gl" x1="${x0}" y1="${y}" x2="${x0+w}" y2="${y}"/>`;
    s+=`<text x="${x0-6}" y="${y+3}" text-anchor="end">${fmt(v)}</text>`;
  }
  return s;
}
function fmt(v){
  if(v>=1000) return (v/1000).toFixed(v>=10000?0:1)+'k';
  return Number.isInteger(v)?v:v.toFixed(1);
}
function fmtDur(sec){
  if(sec==null) return '—';
  if(sec<60) return sec.toFixed(0)+'s';
  const m=Math.floor(sec/60), s=Math.round(sec%60);
  if(m<60) return m+'m '+String(s).padStart(2,'0')+'s';
  const h=Math.floor(m/60), mm=m%60;
  return h+'h '+String(mm).padStart(2,'0')+'m';
}
function median(arr){
  if(!arr.length) return null;
  const s=arr.slice().sort((a,b)=>a-b), m=s.length>>1;
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}
function toolittle(msg){ return `<div class="toolittle">per mažai duomenų${msg?' — '+esc(msg):''}</div>`; }

// ---------- panel 1: agent outcomes ----------
function panelOutcomes(deleg){
  const byAgent={};
  for(const d of deleg){
    if(!d.agent) continue;
    const a=byAgent[d.agent] ||= {completed:0,interrupted:0,unreliable:0,incomplete:0};
    if(d.status==='completed') a.completed++;
    else if(d.status==='interrupted'){ a.interrupted++; if(d.unreliable) a.unreliable++; }
    else if(d.status==='incomplete') a.incomplete++;
  }
  const agents=Object.keys(byAgent).sort((x,y)=>
    (byAgent[y].completed+byAgent[y].interrupted+byAgent[y].incomplete)-(byAgent[x].completed+byAgent[x].interrupted+byAgent[x].incomplete));
  if(!agents.length) return toolittle('nėra delegavimų šiame intervale');

  const W=460,H=40+agents.length*46,x0=92,bw=W-x0-46;
  let s=svgOpen(W,H);
  agents.forEach((a,i)=>{
    const d=byAgent[a], tot=d.completed+d.interrupted;
    const y=20+i*46, pct=tot?d.completed/tot:0;
    s+=`<text x="${x0-8}" y="${y+13}" text-anchor="end" class="val">${esc(a)}</text>`;
    s+=`<rect x="${x0}" y="${y}" width="${bw}" height="18" rx="3" fill="#232833"/>`;
    if(tot){
      s+=`<rect class="bar" x="${x0}" y="${y}" width="${bw*pct}" height="18" rx="3" fill="${C.ok}"/>`;
      if(d.interrupted)
        s+=`<rect class="bar" x="${x0+bw*pct}" y="${y}" width="${bw*(1-pct)}" height="18" rx="3" fill="${C.bad}"/>`;
    }
    s+=`<text x="${x0+bw+6}" y="${y+13}" class="val">${tot?Math.round(pct*100)+'%':'—'}</text>`;
    let line2 = `${d.completed} baigta · ${d.interrupted} nutraukta`;
    if(d.unreliable) line2 += ` (${d.unreliable} nepatikimos trukmės)`;
    if(d.incomplete) line2 += ` · ${d.incomplete} nebaigta`;
    s+=`<text x="${x0}" y="${y+32}">${line2}</text>`;
  });
  s+='</svg>';
  return `<div class="legend"><span><i style="background:${C.ok}"></i>baigta</span>
    <span><i style="background:${C.bad}"></i>nutraukta</span></div>`+s+
    `<div class="note">Nutraukimas reiškia, kad sesija niekada nepasiekė „completed" — kilpa, ESC arba circuit-breaker abortas.
    „Nebaigta" — yra „started" įrašas, bet nei „completed", nei „interrupted" (arba dar vykdoma, arba stebėjimas prarado pėdsaką);
    tai NĖRA nulinė trukmė. „Nepatikimos trukmės" — pažymėta atskirai, žr. „Per užduotis" panelį.</div>`;
}

// ---------- panel 2: duration trend ----------
function panelDuration(deleg, events, bounds){
  const pts=deleg.filter(d=>d.status==='completed'&&d.duration_sec>0&&d.agent&&!d.unreliable);
  if(pts.length<2) return toolittle(pts.length===1
    ? `tik 1 baigtas delegavimas su trukme (${fmtDur(pts[0].duration_sec)}, ${esc(pts[0].agent)}) — negalima piešti tendencijos`
    : 'nėra baigtų taskų su trukme šiame intervale');
  const agents=[...new Set(pts.map(p=>p.agent))];
  const t0=Math.min(...pts.map(p=>+new Date(p.ts_end)));
  const t1=Math.max(...pts.map(p=>+new Date(p.ts_end)));
  const max=Math.max(...pts.map(p=>p.duration_sec));
  const W=460,H=250,x0=48,y0=14,y1=H-34,bw=W-x0-14;
  const X=t=>x0+(t1===t0?bw/2:bw*((+new Date(t)-t0)/(t1-t0)));
  const Y=v=>y1-(y1-y0)*(v/max);
  let s=svgOpen(W,H)+yAxis(x0,y0,y1,max,bw);
  const evtsInRange=(events||[]).filter(e=>{ const t=+new Date(e.ts); return t>=t0 && t<=t1; });
  for(const e of evtsInRange){
    const x=X(e.ts);
    s+=`<g class="evtmark"><line class="evtline" x1="${x}" y1="${y0}" x2="${x}" y2="${y1}"/>` +
       `<title>${esc(e.ts.slice(0,16).replace('T',' '))} · ${esc(e.commit||'uncommitted')} · ${esc(e.title)}\n\n${esc(e.description||'')}</title>` +
       `<text class="evtlabel" x="${x+2}" y="${y0+8}" transform="rotate(90 ${x+2} ${y0+8})">${esc(e.title.slice(0,28))}</text></g>`;
  }
  for(const a of agents){
    const ps=pts.filter(p=>p.agent===a).sort((m,n)=>new Date(m.ts_end)-new Date(n.ts_end));
    const col=AGENT_C[a]||C.dim;
    if(ps.length>1){
      s+=`<polyline fill="none" stroke="${col}" stroke-width="1.5" opacity=".5" points="${
        ps.map(p=>X(p.ts_end)+','+Y(p.duration_sec)).join(' ')}"/>`;
    }
    for(const p of ps) s+=`<circle cx="${X(p.ts_end)}" cy="${Y(p.duration_sec)}" r="3" fill="${col}"><title>${esc(a)} · ${fmtDur(p.duration_sec)} · ${esc(p.ts_end.slice(0,16).replace('T',' '))}</title></circle>`;
  }
  s+=`<line class="axis" x1="${x0}" y1="${y1}" x2="${x0+bw}" y2="${y1}"/>`;
  s+=`<text x="${x0}" y="${y1+16}">${day(new Date(t0).toISOString())}</text>`;
  s+=`<text x="${x0+bw}" y="${y1+16}" text-anchor="end">${day(new Date(t1).toISOString())}</text>`;
  s+=`<text x="${x0-40}" y="${y0-2}">sek.</text></svg>`;
  const leg=agents.map(a=>`<span><i style="background:${AGENT_C[a]||C.dim}"></i>${esc(a)}</span>`).join('');
  const excluded = deleg.filter(d=>d.status==='completed'&&d.duration_sec>0&&d.unreliable).length;
  return `<div class="legend">${leg}<span><i style="background:${C.acc2}"></i>harness pokytis (kabinkite pelę)</span></div>`+s+
    `<div class="note">Kylanti kreivė prie panašaus dydžio promptų reiškia, kad agentas ieško to paties atsakymo vis ilgiau.
    Punktyrinės linijos — harness pokyčiai iš harness-events.json.${excluded?` ${excluded} nepatikimos trukmės įrašų neįtraukta.`:''}</div>`;
}

// ---------- panel 3: circuit-breaker ----------
function panelBreaker(cb){
  if(!cb.length) return toolittle('nė vieno aborto šiame intervale');
  const byReason={};
  for(const e of cb) byReason[e.reason]=(byReason[e.reason]||0)+1;
  const rs=Object.entries(byReason).sort((a,b)=>b[1]-a[1]);
  const max=Math.max(...rs.map(r=>r[1]));
  const W=460,H=24+rs.length*34,x0=200,bw=W-x0-40;
  let s=svgOpen(W,H);
  rs.forEach(([r,n],i)=>{
    const y=10+i*34;
    s+=`<text x="${x0-8}" y="${y+13}" text-anchor="end" class="val">${esc(r)}</text>`;
    s+=`<rect class="bar" x="${x0}" y="${y}" width="${Math.max(2,bw*n/max)}" height="18" rx="3" fill="${C.warn}"/>`;
    s+=`<text x="${x0+Math.max(2,bw*n/max)+6}" y="${y+13}" class="val">${n}</text>`;
  });
  s+='</svg>';
  const avg=(cb.reduce((a,e)=>a+(e.totalToolCalls||0),0)/cb.length).toFixed(1);
  return s+`<div class="note">Iš viso ${cb.length} abortų, vidutiniškai po ${avg} tool call'ų.
    Ankstyvas abortas yra gerai — reiškia, kad kilpa pagauta greitai.</div>`;
}

// ---------- panel 4: reviewer verdicts ----------
function panelVerdicts(deleg){
  const v=deleg.filter(d=>d.agent==='reviewer'&&d.verdict);
  const ap=v.filter(d=>/APPROVED/i.test(d.verdict)&&!/REJECTED/i.test(d.verdict)).length;
  const rj=v.filter(d=>/REJECTED/i.test(d.verdict)).length;
  const noVerdict=deleg.filter(d=>d.agent==='reviewer'&&d.status==='completed'&&!d.verdict).length;
  if(!v.length&&!noVerdict) return toolittle('nėra reviewer duomenų šiame intervale');
  const tot=ap+rj;
  const W=460,H=120,x0=20,bw=W-40;
  let s=svgOpen(W,H);
  s+=`<rect x="${x0}" y="30" width="${bw}" height="26" rx="4" fill="#232833"/>`;
  if(tot){
    s+=`<rect x="${x0}" y="30" width="${bw*ap/tot}" height="26" rx="4" fill="${C.ok}"/>`;
    if(rj) s+=`<rect x="${x0+bw*ap/tot}" y="30" width="${bw*rj/tot}" height="26" rx="4" fill="${C.bad}"/>`;
  }
  s+=`<text x="${x0}" y="22" class="val">APPROVED ${ap}</text>`;
  s+=`<text x="${x0+bw}" y="22" text-anchor="end" class="val">REJECTED ${rj}</text>`;
  s+=`<text x="${x0}" y="76">${noVerdict} baigtų review be užfiksuoto verdikto</text>`;
  s+='</svg>';
  let note;
  if(tot<5) note=`<b style="color:${C.warn}">Per mažai verdiktų (${tot}) šiame intervale patikimam vertinimui.</b>`;
  else if(rj===0&&ap>0) note=`<b style="color:${C.warn}">Nė vieno REJECTED per šį laikotarpį.</b>
    Reviewer promptas turi privalomus atmetimo trigerius (nerišlus vartotojui matomas tekstas,
    hardcoded kredencialai, dublikuota logika). Nulis atmetimų reiškia arba kad tie pažeidimai
    tikrai nepasitaikė, arba kad reviewer jų negaudo — be žinomai blogo diff'o testo neatskirsi.`;
  else if(rj>0) note=`Reviewer realiai atmeta — vadinasi verdiktas ne formalumas.`;
  else note='Per mažai duomenų.';
  return s+`<div class="note">${note}</div>`;
}

// ---------- panel 5: orchestrator time ----------
function panelTiming(tm){
  const done=tm.filter(r=>r.duration_ms!=null);
  if(!done.length) return toolittle('nėra orchestratoriaus timing duomenų šiame intervale');
  const byTool={};
  for(const r of done){
    const b=byTool[r.tool] ||= {n:0,dur:0,gap:0,gapN:0};
    b.n++; b.dur+=r.duration_ms||0;
    if(r.gap_before_ms!=null){ b.gap+=r.gap_before_ms; b.gapN++; }
  }
  const rows=Object.entries(byTool)
    .map(([t,b])=>({t,n:b.n,dur:b.dur/b.n/1000,gap:b.gapN?b.gap/b.gapN/1000:0}))
    .sort((a,b)=>(b.dur+b.gap)-(a.dur+a.gap)).slice(0,9);
  const max=Math.max(...rows.map(r=>r.dur+r.gap))||1;
  const W=460,H=26+rows.length*34,x0=150,bw=W-x0-56;
  let s=svgOpen(W,H);
  rows.forEach((r,i)=>{
    const y=10+i*34, wg=bw*r.gap/max, wd=bw*r.dur/max;
    s+=`<text x="${x0-8}" y="${y+13}" text-anchor="end" class="val">${esc(r.t)}</text>`;
    s+=`<rect class="bar" x="${x0}" y="${y}" width="${Math.max(1,wg)}" height="18" rx="2" fill="${C.acc2}"/>`;
    s+=`<rect class="bar" x="${x0+wg}" y="${y}" width="${Math.max(1,wd)}" height="18" rx="2" fill="${C.acc}"/>`;
    s+=`<text x="${x0+wg+wd+6}" y="${y+13}">${(r.gap+r.dur).toFixed(1)}s ×${r.n}</text>`;
  });
  s+='</svg>';
  const totGap=done.reduce((a,r)=>a+(r.gap_before_ms||0),0)/1000;
  const totDur=done.reduce((a,r)=>a+(r.duration_ms||0),0)/1000;
  return `<div class="legend"><span><i style="background:${C.acc2}"></i>galvojimas prieš (gap)</span>
    <span><i style="background:${C.acc}"></i>įrankio vykdymas</span></div>`+s+
    `<div class="note">Vidutinė trukmė vienam kvietimui. Iš viso ${totGap.toFixed(0)}s galvojimo prieš
     ${totDur.toFixed(0)}s realaus vykdymo — jei violetinė dalis dominuoja, laikas dingsta modelyje, ne įrankiuose.</div>`;
}

// ---------- panel 6: prompt size ----------
function panelPrompts(deleg){
  const p=deleg.filter(d=>d.prompt_chars>0&&d.agent);
  if(!p.length) return toolittle('nėra prompt dydžio duomenų šiame intervale');
  const byAgent={};
  for(const r of p){ (byAgent[r.agent] ||= []).push(r.prompt_chars); }
  const rows=Object.entries(byAgent).map(([a,v])=>({
    a, n:v.length, avg:v.reduce((x,y)=>x+y,0)/v.length, max:Math.max(...v)
  })).sort((x,y)=>y.max-x.max);
  const max=Math.max(...rows.map(r=>r.max));
  const W=460,H=26+rows.length*38,x0=110,bw=W-x0-70;
  let s=svgOpen(W,H);
  rows.forEach((r,i)=>{
    const y=10+i*38;
    s+=`<text x="${x0-8}" y="${y+13}" text-anchor="end" class="val">${esc(r.a)}</text>`;
    s+=`<rect x="${x0}" y="${y}" width="${bw*r.max/max}" height="18" rx="3" fill="#2c3444"/>`;
    s+=`<rect class="bar" x="${x0}" y="${y}" width="${Math.max(2,bw*r.avg/max)}" height="18" rx="3" fill="${AGENT_C[r.a]||C.dim}"/>`;
    s+=`<text x="${x0+bw*r.max/max+6}" y="${y+13}">${fmt(r.max)}</text>`;
    s+=`<text x="${x0}" y="${y+31}">vid. ${fmt(r.avg)} simb. · ${r.n} kvietimų</text>`;
  });
  s+='</svg>';
  return s+`<div class="note">Šviesi juosta — vidurkis, tamsi — maksimumas.
    Didelis skirtumas reiškia, kad kai kurie delegavimai gauna gerokai daugiau nei kiti.</div>`;
}

// ---------- panel 7: per-task view ----------
function shortTaskId(tid){
  const m=(tid||'').match(/^(\d+)-(.+)$/);
  if(!m) return esc(tid||'?');
  const d=new Date(+m[1]);
  return isNaN(d) ? esc(tid) : d.toISOString().slice(5,16).replace('T',' ')+' · '+esc(m[2]);
}
function outcomeBadge(d){
  if(d.status==='incomplete') return '<span class="badge-incomplete">nebaigta</span>';
  if(d.status==='interrupted'){
    return d.unreliable
      ? `<span class="badge-unreliable" title="${esc(d.unreliableReason)}">nutraukta ⚠ nepatikima trukmė</span>`
      : '<span style="color:var(--bad)">nutraukta</span>';
  }
  if(d.verdict){
    return /REJECTED/i.test(d.verdict) ? '<span class="badge-rejected">REJECTED</span>'
      : /APPROVED/i.test(d.verdict) ? '<span class="badge-approved">APPROVED</span>' : esc(d.verdict);
  }
  return '<span style="color:var(--ok)">baigta</span>';
}
function panelPerTask(deleg){
  const byTask=new Map();
  for(const d of deleg){
    if(!d.task_id) continue;
    if(!byTask.has(d.task_id)) byTask.set(d.task_id, []);
    byTask.get(d.task_id).push(d);
  }
  if(!byTask.size) return toolittle('nėra taskų šiame intervale');
  const tasks=[...byTask.entries()].map(([task_id,rows])=>{
    rows.sort((a,b)=>new Date(a.ts_start||a.ts_end)-new Date(b.ts_start||b.ts_end));
    const starts=rows.map(r=>r.ts_start||r.ts_end).filter(Boolean).map(t=>+new Date(t));
    const ends=rows.map(r=>r.ts_end).filter(Boolean).map(t=>+new Date(t));
    const wallStart = starts.length?Math.min(...starts):null;
    const allHaveEnd = rows.every(r=>r.ts_end);
    const wallEnd = ends.length?Math.max(...ends):null;
    const wallSec = wallStart!=null ? ((allHaveEnd&&wallEnd!=null)?(wallEnd-wallStart):(Date.now()-wallStart))/1000 : null;
    const hasIssue = rows.some(r=>r.status==='interrupted'||r.status==='incomplete');
    const lastReview = [...rows].reverse().find(r=>r.agent==='reviewer'&&r.verdict);
    let summary = hasIssue ? '⚠ turi nutrūkusių/nebaigtų' :
      (lastReview && /REJECTED/i.test(lastReview.verdict) ? 'REJECTED' : 'OK');
    return {task_id, rows, wallStart, wallSec, openEnded: !allHaveEnd, summary};
  }).sort((a,b)=>(b.wallStart||0)-(a.wallStart||0));

  const rowsHtml = tasks.map(t=>{
    const delegRows = t.rows.map(d=>`
      <tr>
        <td>${esc(d.agent||'')}</td>
        <td>${esc((d.model||'').replace(', via llama-swap','').replace(' (via llama-swap)',''))}</td>
        <td>${d.unreliable?`<span class="badge-unreliable" title="${esc(d.unreliableReason)}">${fmtDur(d.duration_sec)} ⚠</span>`:fmtDur(d.duration_sec)}</td>
        <td>${d.prompt_chars!=null?fmt(d.prompt_chars):'—'}</td>
        <td>${d.n_toolcalls!=null?d.n_toolcalls:'—'}</td>
        <td>${d.verdict?esc(d.verdict):'—'}</td>
        <td>${outcomeBadge(d)}</td>
        <td>${d.desc?esc(d.desc):'<span style="color:var(--dim)">—</span>'}</td>
      </tr>`).join('');
    return `<details class="task-item">
      <summary>
        <span class="tid">${shortTaskId(t.task_id)}</span>
        <span class="tmeta">${t.rows.length} delegavimai · ${fmtDur(t.wallSec)}${t.openEnded?' (nebaigta)':''} · ${t.summary}</span>
      </summary>
      <div class="deleg-wrap scrollx"><table>
        <thead><tr><th>agentas</th><th>modelis</th><th>trukmė</th><th>promptas</th><th>tool'ai</th><th>verdiktas</th><th>baigtis</th><th>aprašymas</th></tr></thead>
        <tbody>${delegRows}</tbody>
      </table></div>
    </details>`;
  }).join('');
  return `<div class="note" style="margin:0 0 10px">${tasks.length} taskai šiame intervale. Spustelėkite eilutę, kad išskleistumėte delegavimus.</div>
    <div>${rowsHtml}</div>`;
}

// ---------- panel 8: harness events + before/after ----------
function evtBounds(evtTs, all){
  const t=+new Date(evtTs);
  return {t, before: all.filter(x=>+new Date(delegTs(x)||x.ts)<t), after: all.filter(x=>+new Date(delegTs(x)||x.ts)>=t)};
}
function sideStats(list, cbList){
  const completed = list.filter(d=>d.status==='completed').length;
  const interrupted = list.filter(d=>d.status==='interrupted').length;
  const compN = completed+interrupted;
  const completionRate = compN ? completed/compN : null;
  const byAgentDur = {};
  for(const d of list){
    if(d.status==='completed' && d.duration_sec>0 && !d.unreliable){
      (byAgentDur[d.agent] ||= []).push(d.duration_sec);
    }
  }
  const medianByAgent = {};
  Object.keys(byAgentDur).forEach(a=>{ medianByAgent[a] = {n:byAgentDur[a].length, median:median(byAgentDur[a])}; });
  const verdicts = list.filter(d=>d.agent==='reviewer'&&d.verdict);
  const rej = verdicts.filter(d=>/REJECTED/i.test(d.verdict)).length;
  const app = verdicts.filter(d=>/APPROVED/i.test(d.verdict)&&!/REJECTED/i.test(d.verdict)).length;
  const rejN = rej+app;
  const rejectRate = rejN ? rej/rejN : null;
  const days = new Set(list.map(d=>day(delegTs(d)))).size || 1;
  return {n:list.length, completed, interrupted, compN, completionRate, medianByAgent,
    rejectRate, rejN, aborts:cbList.length, abortsPerDay:cbList.length/days, days};
}
function baCell(val, n, fmtFn, min=5){
  const notMeaningful = n<min;
  const txt = val==null ? '—' : fmtFn(val);
  return `<div>${txt} <span class="ba-n${notMeaningful?' ba-notmeaningful':''}">${notMeaningful?`(n=${n}, nereikšminga)`:`(n=${n})`}</span></div>`;
}
function computeAndRenderBA(evt, allDeleg, allCb){
  const {t, before, after} = (()=>{ const t=+new Date(evt.ts);
    return {t, before: allDeleg.filter(d=>+new Date(delegTs(d))<t), after: allDeleg.filter(d=>+new Date(delegTs(d))>=t)}; })();
  const cbBefore = allCb.filter(c=>+new Date(c.ts)<t), cbAfter = allCb.filter(c=>+new Date(c.ts)>=t);
  const sb = sideStats(before, cbBefore), sa = sideStats(after, cbAfter);
  const agents = [...new Set([...Object.keys(sb.medianByAgent), ...Object.keys(sa.medianByAgent)])].sort();
  let agentRows = agents.map(a=>{
    const b = sb.medianByAgent[a]||{n:0,median:null}, af = sa.medianByAgent[a]||{n:0,median:null};
    return `<tr><td>${esc(a)}</td><td>${baCell(b.median,b.n,fmtDur)}</td><td>${baCell(af.median,af.n,fmtDur)}</td></tr>`;
  }).join('');
  const lowSample = sb.n<5 || sa.n<5;
  return `
    ${lowSample?`<div class="warnbox">Per mažai duomenų vienoje iš pusių (prieš: ${sb.n}, po: ${sa.n} įrašų) — žemiau esantys skaičiai TIKRI, bet palyginimas NĖRA statistiškai reikšmingas.</div>`:''}
    <div class="scrollx"><table>
      <thead><tr><th></th><th>Prieš (${sb.n} įrašų, ${sb.days}d.)</th><th>Po (${sa.n} įrašų, ${sa.days}d.)</th></tr></thead>
      <tbody>
        <tr><td>Baigtumo rodiklis</td>
          <td>${baCell(sb.completionRate, sb.compN, v=>Math.round(v*100)+'%')}</td>
          <td>${baCell(sa.completionRate, sa.compN, v=>Math.round(v*100)+'%')}</td></tr>
        <tr><td>Abortai / diena</td>
          <td>${baCell(sb.abortsPerDay, sb.aborts, v=>v.toFixed(2))}</td>
          <td>${baCell(sa.abortsPerDay, sa.aborts, v=>v.toFixed(2))}</td></tr>
        <tr><td>REJECTED dalis</td>
          <td>${baCell(sb.rejectRate, sb.rejN, v=>Math.round(v*100)+'%')}</td>
          <td>${baCell(sa.rejectRate, sa.rejN, v=>Math.round(v*100)+'%')}</td></tr>
        ${agentRows}
      </tbody>
    </table></div>
    <div class="note">Mediana, ne vidurkis. Šis palyginimas naudoja VISĄ istoriją (nepriklausomai nuo viršuje pasirinkto intervalo) —
    „prieš" ir „po" yra visi įrašai prieš/po įvykio laiko žymos. Trukmės medianos neįtraukia nepatikimų (stale-sweep) įrašų.</div>`;
}
function panelHarnessImpact(events, allDeleg, allCb){
  if(!events || !events.length) return toolittle('harness-events.json tuščias arba nerastas');
  const evtList = events.slice().sort((a,b)=>new Date(a.ts)-new Date(b.ts)).map(e=>
    `<div class="evtrow" title="${esc(e.description||'')}">
      <span class="d">${esc(e.ts.slice(0,16).replace('T',' '))}</span>
      <span class="c">${esc(e.commit||'uncommitted')}</span>
      <span class="t">${esc(e.title)}</span>
    </div>`).join('');
  const options = events.slice().sort((a,b)=>new Date(a.ts)-new Date(b.ts))
    .map((e,i)=>`<option value="${esc(e.id)}">${esc(e.ts.slice(0,16).replace('T',' '))} — ${esc(e.title)}</option>`).join('');
  return `<div class="evtlist">${evtList}</div>
    <div class="controls" style="margin-bottom:10px">
      <label>Palyginti prieš/po: <select id="evtSelect">${options}</select></label>
    </div>
    <div id="baResult"></div>`;
}

// ---------- render ----------
function render(){
  const bounds = computeRangeBounds(RANGE_SPEC);
  document.getElementById('range').textContent = 'Kraunama…';

  const deleg = DATA.delegations.filter(d=>inRange(delegTs(d), bounds));
  const cb = DATA.cb.filter(e=>inRange(e.ts, bounds));
  const tm = DATA.timing.filter(r=>inRange(r.ts, bounds));

  const allTs=[...deleg.map(delegTs),...cb.map(r=>r.ts),...tm.map(r=>r.ts)].filter(Boolean).sort();
  document.getElementById('range').textContent = allTs.length
    ? `${bounds.label} · ${day(allTs[0])} → ${day(allTs[allTs.length-1])} · ${deleg.length} delegavimų · ${cb.length} abortų · ${tm.length} timing įrašų`
    : `${bounds.label} · nėra duomenų pasirinktame intervale`;

  const completed=deleg.filter(t=>t.status==='completed').length;
  const interrupted=deleg.filter(t=>t.status==='interrupted').length;
  const incomplete=deleg.filter(t=>t.status==='incomplete').length;
  const rate=completed+interrupted ? Math.round(100*completed/(completed+interrupted)) : null;
  const rateC = rate==null?C.dim : rate>=90?C.ok : rate>=70?C.warn : C.bad;
  const days=[...new Set(deleg.map(t=>day(delegTs(t))))].length||1;

  document.getElementById('app').innerHTML=`
  <div class="kpis">
    <div class="kpi"><div class="v" style="color:${rateC}">${rate==null?'—':rate+'%'}</div><div class="l">baigta sėkmingai</div></div>
    <div class="kpi"><div class="v">${completed}</div><div class="l">baigti delegavimai</div></div>
    <div class="kpi"><div class="v" style="color:${interrupted?C.bad:C.ok}">${interrupted}</div><div class="l">nutraukti</div></div>
    <div class="kpi"><div class="v" style="color:${C.dim}">${incomplete}</div><div class="l">nebaigti (be rezultato)</div></div>
    <div class="kpi"><div class="v" style="color:${C.warn}">${cb.length}</div><div class="l">circuit-breaker abortų</div></div>
    <div class="kpi"><div class="v">${(deleg.length/days).toFixed(0)}</div><div class="l">delegavimų per dieną</div></div>
  </div>
  <div class="grid">
    <div class="panel"><h2>Ar agentai baigia darbą</h2>${panelOutcomes(deleg)}</div>
    <div class="panel"><h2>Reviewer verdiktai</h2>${panelVerdicts(deleg)}</div>
    <div class="panel"><h2>Trukmės kitimas</h2>${panelDuration(deleg, DATA.events, bounds)}</div>
    <div class="panel"><h2>Circuit-breaker abortai</h2>${panelBreaker(cb)}</div>
    <div class="panel"><h2>Kur dingsta orchestratoriaus laikas</h2>${panelTiming(tm)}</div>
    <div class="panel"><h2>Promptų dydis pagal agentą</h2>${panelPrompts(deleg)}</div>
    <div class="panel wide"><h2>Per užduotis (task_id)</h2>${panelPerTask(deleg)}</div>
    <div class="panel wide"><h2>Harness pokyčiai ir jų poveikis</h2>${panelHarnessImpact(DATA.events, DATA.delegations, DATA.cb)}</div>
  </div>`;

  const sel = document.getElementById('evtSelect');
  if(sel){
    const renderBA = ()=>{
      const evt = DATA.events.find(e=>e.id===sel.value);
      document.getElementById('baResult').innerHTML = evt ? computeAndRenderBA(evt, DATA.delegations, DATA.cb) : '';
    };
    sel.onchange = renderBA;
    sel.value = DATA.events[DATA.events.length-1] ? [...DATA.events].sort((a,b)=>new Date(a.ts)-new Date(b.ts)).slice(-1)[0].id : '';
    renderBA();
  }
}

(async()=>{
  try{
    const [tasks,cb,timing]=await Promise.all([jsonl(F.tasks),jsonl(F.cb),jsonl(F.timing)]);
    let events=[];
    try{ events = await jsonFile(F.events); }
    catch(e){ console.warn('harness-events.json neįkeltas:', e.message); events=[]; }

    const delegations = buildDelegations(tasks);
    enrichDescriptions(delegations, timing);

    DATA={delegations, cb, timing, events};
    RANGE_SPEC = parseHash();
    syncRangeUI();
    render();
  }catch(e){
    document.getElementById('app').innerHTML=
      `<div class="err"><b>Nepavyko įkelti duomenų:</b> ${esc(e.message)}<br><br>
       Šis failas turi būti atidarytas per HTTP serverį, ne per <code>file://</code>.<br>
       <code>cd .opencode/reports &amp;&amp; python3 -m http.server 8899</code><br>
       tada <code>http://localhost:8899/dashboard.html</code></div>`;
  }
})();
</script>
</body>
</html>
